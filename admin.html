<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Admin - DEVWEBIA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-6">

  <!-- LOGIN BOX -->
  <div id="loginBox" class="max-w-md mx-auto my-20 bg-slate-900 p-8 rounded-2xl border border-slate-800 space-y-6 text-center">
    <h1 class="text-2xl font-black text-indigo-400">Fitantanana Admin</h1>
    <p class="text-xs text-slate-400">Ampidiro ny teny miafina (Par défaut: 1234)</p>
    <input type="password" id="adminPass" placeholder="Teny miafina..." class="w-full p-3 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-indigo-500">
    <button id="loginBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg transition">Hiditra Admin</button>
  </div>

  <!-- ADMIN PANEL CONTENT -->
  <div id="adminPanel" class="max-w-6xl mx-auto space-y-8 hidden">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-extrabold text-indigo-400">Espace Admin Operations</h1>
      <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm">Hiverina amin'ny Site</a>
    </div>

    <!-- IMAGE UPLOADER CANVAS COMPRESSOR -->
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
      <h2 class="text-xl font-bold text-white">📸 Uploader sy Compresseur Sary Canvas (<150KB)</h2>
      <input type="file" id="adminImgUpload" accept="image/*" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
      <div id="imgPreviewContainer" class="hidden space-y-2">
        <p class="text-xs text-slate-400">Aperçu ary compressed base64:</p>
        <img id="imgPreview" src="" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=800&q=80';" class="h-32 rounded border border-slate-700 object-cover">
      </div>
    </div>

    <!-- MESSAGES INBOX -->
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
      <h2 class="text-xl font-bold text-white">📥 Boîte de Réception Messages LocalStorage</h2>
      <div id="messagesList" class="space-y-4">
        <!-- Messages dynamic -->
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
